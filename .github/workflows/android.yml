name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Hello Star Vibe Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v5

      - name: 2. Set up JDK 17 & 21 (Required for Gradle 9.3.1 & AGP 9.1.1)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
          name: Hello Star Live Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK Information
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          adb version
          sdkmanager --version
          packages: 'tools platform-tools'

      - name: 4. Install Android SDK Platform 36 / 36.1 & Build-Tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 5. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: 6. Locate Android Project Root & Restore Gradle Wrapper and Keystore
        run: |
          PROJECT_DIR="."
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            FOUND_SETTINGS=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1 || true)
            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$FOUND_SETTINGS")
              echo "Located Android Gradle project in subfolder: $PROJECT_DIR"
            else
              echo "::error::Android Gradle project files (settings.gradle.kts, app/build.gradle.kts) were not found in this repository."
              echo "::error::Please push all project files from Google AI Studio ('Push to GitHub' or 'Download ZIP') to this GitHub repository."
              exit 1
            fi
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"

          if [ -f "gradle/wrapper/gradle-wrapper.jar.base64" ] && [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            base64 -d gradle/wrapper/gradle-wrapper.jar.base64 > gradle/wrapper/gradle-wrapper.jar
          fi

          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper
          fi

          chmod +x gradlew

          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 7. Verify Gradle Wrapper Version
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --version

      - name: 8. Build Debug APK with Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 9. Verify Debug APK Exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: 10. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloStarVibe-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
