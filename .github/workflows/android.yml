name: Hello Star Live Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Locate Android project and restore Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="."
          if [[ ! -f "settings.gradle.kts" && ! -f "settings.gradle" ]]; then
            SETTINGS_FILE="$(find . -maxdepth 4 -type f \\( -name settings.gradle.kts -o -name settings.gradle \\) | head -n 1)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "::error::Android project settings.gradle(.kts) not found."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"

          if [[ ! -f gradle/wrapper/gradle-wrapper.jar && -f gradle/wrapper/gradle-wrapper.jar.base64 ]]; then
            base64 --decode gradle/wrapper/gradle-wrapper.jar.base64 > gradle/wrapper/gradle-wrapper.jar
          fi

          if [[ ! -f gradlew ]]; then
            echo "::error::gradlew is missing from the Android project."
            exit 1
          fi
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "::error::Gradle wrapper JAR could not be restored."
            exit 1
          fi
          chmod +x gradlew

      - name: Verify Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hello-Star-Live-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
